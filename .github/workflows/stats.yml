name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Corre todos los días a medianoche UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando quieras

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          fail_on_error: true
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "hide": "issues,prs",
              "hide_rank": true,
              "show_icons": true,
              "include_all_commits": true,
              "custom_title": "GitHub Activity",
              "card_width": 495
            }
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          fail_on_error: true
          options: |
            {
              "username": "${{ github.repository_owner }}",
              "layout": "compact",
              "langs_count": 5,
              "hide": "c++,html,css",
              "size_weight": 0.5,
              "count_weight": 0.5,
              "custom_title": "Languages"
            }
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push stats
        run: |
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub stats"
          git push origin HEAD:main
